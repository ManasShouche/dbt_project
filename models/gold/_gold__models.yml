version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: nation_name
        data_tests: [not_null]
      - name: region_name
        data_tests: [not_null]

  - name: fct_orders
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: line_item_count
        data_tests: [not_null]
      - name: net_amount
        data_tests: [not_null]

      - name: is_within_ship_sla
        data_tests: [not_null]

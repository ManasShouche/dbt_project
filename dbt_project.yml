name: 'tpch_clean'
version: '1.0.0'
profile: 'tpch_pipeline'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:

  raw_schema: raw

  raw_streams_schema: raw_streams

  late_arrival_hours: 6

models:
  tpch_clean:
    +persist_docs:
      relation: true
      columns: true

    bronze:
      +materialized: view
      +schema: bronze

    silver:
      +materialized: dynamic_table
      +target_lag: '1 hour'

      +snowflake_warehouse: "{{ target.warehouse }}"
      +schema: silver

    gold:
      +materialized: table
      +schema: gold

    audit:
      +materialized: view
      +schema: audit

seeds:
  tpch_clean:
    +schema: seeds

snapshots:
  tpch_clean:
    +schema: snapshots
